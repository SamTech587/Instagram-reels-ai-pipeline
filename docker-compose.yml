version: '3.8'

services:
  n8n:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: n8n-instagram-pipeline
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - NODES_EXCLUDE=[]
      - N8N_RESTRICT_FILE_ACCESS_TO=/scripts;/home/node/.n8n-files
    volumes:
      - n8n_data:/home/node/.n8n
      - ./scripts:/scripts
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
    name: n8n_data
